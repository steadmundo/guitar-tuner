<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Guitar & Ukulele Tuner</title>
<style>
  :root {
    font-family: system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    background: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 60%);
  }
  h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #94a3b8; }
  /* Mode switch */
  .modes { display: flex; gap: 8px; margin: 16px 0 8px; }
  .modes button {
    background: #1e293b; color: #94a3b8; border: 1px solid #334155;
    padding: 8px 18px; border-radius: 999px; font-size: 0.9rem; cursor: pointer;
    transition: all 0.2s;
  }
  .modes button.active { background: #38bdf8; border-color: #38bdf8; color: #0f172a; font-weight: 600; }
  /* String selector */
  .strings { display: flex; gap: 6px; margin: 10px 0 4px; flex-wrap: wrap; justify-content: center; }
  .strings button {
    background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
    width: 44px; padding: 10px 0; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer;
    transition: all 0.15s;
  }
  .strings button:hover { border-color: #38bdf8; }
  .strings button.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }
  .strings button.auto { width: auto; padding: 10px 14px; font-size: 0.8rem; }
  .strings button.detected { box-shadow: 0 0 0 2px #a78bfa; }
  /* Display */
  .note-display { text-align: center; margin: 8px 0 4px; min-height: 120px; }
  .note-name { font-size: 4.5rem; font-weight: 700; line-height: 1; }
  .note-name.in-tune { color: #4ade80; text-shadow: 0 0 24px rgba(74, 222, 128, 0.4); }
  .freq { font-size: 0.85rem; color: #64748b; margin-top: 4px; }
  .cents-label { font-size: 1rem; margin-top: 6px; color: #94a3b8; min-height: 1.4em; }
  /* Meter */
  .meter { position: relative; width: min(420px, 92vw); height: 56px; margin: 8px auto 4px; }
  .meter svg { width: 100%; height: 100%; }
  .needle { transition: transform 0.12s ease-out; transform-origin: 210px 50px; }
  /* Tuning state strip */
  .state { font-size: 1.2rem; font-weight: 600; margin-top: 6px; min-height: 1.6em; }
  .state.flat { color: #f87171; }
  .state.sharp { color: #fb923c; }
  .state.ok { color: #4ade80; }
  /* Buttons */
  .big-btn {
    margin-top: 20px; padding: 14px 40px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #38bdf8, #818cf8); color: #0f172a;
    font-size: 1rem; font-weight: 700; cursor: pointer;
  }
  .big-btn.stop { background: #ef4444; color: white; }
  .hint { margin-top: 14px; font-size: 0.75rem; color: #475569; text-align: center; max-width: 340px; line-height: 1.5; }
  .error { color: #f87171; margin-top: 10px; font-size: 0.85rem; display: none; }
</style>
</head>
<body>
  <h1>Tuner</h1>
  <div class="modes">
    <button id="m-guitar" class="active">Guitar</button>
    <button id="m-ukulele">Ukulele</button>
    <button id="m-chromatic">Chromatic</button>
  </div>

  <div class="strings" id="strings"></div>

  <div class="note-display">
    <div class="note-name" id="note">–</div>
    <div class="freq" id="freq"></div>
    <div class="cents-label" id="cents"></div>
  </div>

  <div class="meter">
    <svg viewBox="0 0 420 56">
      <rect x="0" y="46" width="420" height="8" rx="4" fill="#1e293b"/>
      <rect x="196" y="42" width="28" height="16" rx="3" fill="#4ade80" opacity="0.5"/>
      <rect x="136" y="42" width="28" height="16" rx="3" fill="#334155"/>
      <rect x="256" y="42" width="28" height="16" rx="3" fill="#334155"/>
      <g class="needle" id="needle">
        <line x1="210" y1="50" x2="210" y2="8" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
      </g>
    </svg>
  </div>

  <div class="state" id="state"></div>

  <button class="big-btn" id="start">Start Tuner</button>
  <div class="error" id="err"></div>
  <p class="hint" id="hint">Pluck one string at a time, let it ring. Keep background noise low.</p>

<script>
(function () {
  "use strict";

  var NOTES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

  var MODES = {
    guitar: { label: "Guitar (Standard)", strings: ["E2", "A2", "D3", "G3", "B3", "E4"] },
    ukulele: { label: "Ukulele (Standard)", strings: ["G4", "C4", "E4", "A4"] },
    chromatic: { label: "Chromatic", strings: null }
  };

  function noteFreq(note) {
    var m = note.match(/^([A-G]#?)(\d)$/);
    var semis = NOTES.indexOf(m[1]) + (parseInt(m[2], 10) + 1) * 12;
    return 440 * Math.pow(2, (semis - 69) / 12);
  }

  var IN_TUNE = 10; // cents tolerance - wide enough that a ringing string doesn't flicker
  var mode = "guitar";
  var selected = 0;        // index into mode strings, or -1 for auto
  var audioCtx = null, analyser = null, raf = null, running = false;

  var $ = function (id) { return document.getElementById(id); };
  var noteEl = $("note"), freqEl = $("freq"), centsEl = $("cents"),
      stateEl = $("state"), needleEl = $("needle"),
      stringsEl = $("strings"), errEl = $("err"), startBtn = $("start");

  // ---------- UI ----------

  function renderStrings() {
    stringsEl.innerHTML = "";
    var m = MODES[mode];
    if (mode === "chromatic") return;
    for (var i = 0; i < m.strings.length; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.textContent = m.strings[idx];
        b.className = idx === selected ? "active" : "";
        b.onclick = function () { selected = (selected === idx) ? -1 : idx; renderStrings(); };
        stringsEl.appendChild(b);
      })(i);
    }
    var auto = document.createElement("button");
    auto.className = "auto" + (selected === -1 ? " active" : "");
    auto.textContent = "Auto";
    auto.onclick = function () { selected = -1; renderStrings(); };
    stringsEl.appendChild(auto);
  }

  var modeBtns = { guitar: $("m-guitar"), ukulele: $("m-ukulele"), chromatic: $("m-chromatic") };
  Object.keys(modeBtns).forEach(function (k) {
    modeBtns[k].onclick = function () {
      mode = k; selected = 0;
      Object.keys(modeBtns).forEach(function (j) { modeBtns[j].classList.toggle("active", j === k); });
      renderStrings(); resetDisplay();
    };
  });

  function resetDisplay() {
    noteEl.textContent = "–";
    noteEl.classList.remove("in-tune");
    freqEl.textContent = "";
    centsEl.textContent = "";
    stateEl.textContent = "";
    stateEl.className = "state";
    setNeedle(0);
  }

  function setNeedle(cents) { // cents: -50..50
    var c = Math.max(-50, Math.min(50, cents));
    needleEl.style.transform = "rotate(" + (c * 1.7) + "deg)";
  }

  // ---------- Pitch detection (autocorrelation) ----------

  function autoCorrelate(buf, sampleRate) {
    var SIZE = buf.length, rms = 0;
    for (var i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
    rms = Math.sqrt(rms / SIZE);
    if (rms < 0.01) return -1; // too quiet

    var THRES = 0.2, maxLag = Math.floor(SIZE / 2);
    var r = new Float32Array(maxLag), best = -1, bestVal = 0;
    for (var lag = 40; lag < maxLag; lag++) {
      var sum = 0, norm = 0;
      for (var j = 0; j < maxLag; j++) {
        var a = buf[j], b = buf[j + lag];
        sum += a * b; norm += a * a + b * b;
      }
      r[lag] = 2 * sum / (norm || 1);
      if (r[lag] > bestVal) { bestVal = r[lag]; best = lag; }
    }
    if (best === -1 || bestVal < THRES) return -1;

    // parabolic interpolation around the peak
    var y1 = r[best - 1] || 0, y2 = r[best], y3 = r[best + 1] || 0;
    var denom = y1 - 2 * y2 + y3;
    var shift = denom ? (0.5 * (y3 - y1) / denom) : 0;
    return sampleRate / (best + shift);
  }

  function freqToNote(freq) {
    var semis = 12 * Math.log2(freq / 440) + 69;
    var n = Math.round(semis);
    return {
      name: NOTES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1),
      midi: n,
      cents: (semis - n) * 100
    };
  }

  // ---------- Main loop ----------

  var buf = null;
  var recent = [];   // last few raw frequency readings for smoothing

  function tick() {
    if (!running) return;
    analyser.getFloatTimeDomainData(buf);
    var f = autoCorrelate(buf, audioCtx.sampleRate);

    if (f === -1) { /* wait for signal */ }
    else {
      recent.push(f);
      if (recent.length > 5) recent.shift();
      // median of recent readings dampens single-frame jitter
      var sorted = recent.slice().sort(function (a, b) { return a - b; });
      update(sorted[Math.floor(sorted.length / 2)]);
    }

    raf = requestAnimationFrame(tick);
  }

  function update(f) {
    var info = freqToNote(f);
    var target;
    var m = MODES[mode];

    if (mode !== "chromatic" && selected >= 0) {
      target = noteFreq(m.strings[selected]);
    } else {
      // nearest target: nearest string note in instrument mode, else nearest semitone
      target = 440 * Math.pow(2, (info.midi - 69) / 12);
    }

    var cents = 1200 * Math.log2(f / target);
    var inTune = Math.abs(cents) < IN_TUNE;

    noteEl.textContent = info.name;
    noteEl.classList.toggle("in-tune", inTune);
    freqEl.textContent = f.toFixed(1) + " Hz";
    centsEl.textContent = (cents > 0 ? "+" : "") + cents.toFixed(0) + " cents";
    setNeedle(cents);

    if (Math.abs(cents) < 5) {
      stateEl.textContent = "In tune";
      stateEl.className = "state ok";
    } else if (cents < 0) {
      stateEl.textContent = "Too flat — tighten";
      stateEl.className = "state flat";
    } else {
      stateEl.textContent = "Too sharp — loosen";
      stateEl.className = "state sharp";
    }

    // highlight nearest string button in instrument modes
    if (mode !== "chromatic") {
      var nearest = 0, nd = Infinity;
      for (var i = 0; i < m.strings.length; i++) {
        var d = Math.abs(1200 * Math.log2(f / noteFreq(m.strings[i])));
        if (d < nd) { nd = d; nearest = i; }
      }
      var btns = stringsEl.querySelectorAll("button:not(.auto)");
      btns.forEach(function (b, i) { b.classList.toggle("detected", i === nearest && nd < 100); });
    }
  }

  // ---------- Mic ----------

  function start() {
    errEl.style.display = "none";
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      showError("This browser/context does not support microphone access. Use HTTPS or localhost.");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } })
      .then(function (stream) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        var src = audioCtx.createMediaStreamSource(stream);
        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 2048;
        src.connect(analyser);
        buf = new Float32Array(analyser.fftSize);
        running = true;
        startBtn.textContent = "Stop";
        startBtn.classList.add("stop");
        tick();
      })
      .catch(function (e) {
        showError("Microphone access denied or unavailable: " + e.message);
      });
  }

  function stop() {
    running = false;
    recent = [];
    if (raf) cancelAnimationFrame(raf);
    if (audioCtx) { audioCtx.close(); audioCtx = null; }
    startBtn.textContent = "Start Tuner";
    startBtn.classList.remove("stop");
    resetDisplay();
  }

  function showError(msg) { errEl.textContent = msg; errEl.style.display = "block"; }

  startBtn.onclick = function () { running ? stop() : start(); };

  renderStrings();
})();
</script>
</body>
</html>
